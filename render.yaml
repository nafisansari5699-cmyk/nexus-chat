services:
  - type: web
    name: nexus-chat-app
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: ./db
      - key: UPLOAD_DIR
        value: ./uploads
